<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Expense & Budget Tracker</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { background: #1d2330; color: #fff; padding: 22px 32px; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; color: #aab1bf; font-size: 14px; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 20px; display: grid; gap: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  .card h2 { margin: 0 0 14px; font-size: 16px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .stat .label { color: var(--muted); font-size: 13px; }
  .stat .value { font-size: 24px; font-weight: 600; margin-top: 6px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .progress { height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; margin: 10px 0 8px; }
  .progress div { height: 100%; width: 0; background: var(--ok); transition: width .3s; }
  .alert { padding: 10px 12px; border-radius: 8px; font-size: 14px; }
  .alert.ok { background: #dcfce7; color: #166534; }
  .alert.warn { background: #fef3c7; color: #92400e; }
  .alert.bad { background: #fee2e2; color: #991b1b; }
  .alert.none { background: #eef2ff; color: #3730a3; }
  form { display: grid; gap: 10px; }
  label { font-size: 13px; color: var(--muted); }
  input, select, button { font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; width: 100%; }
  button { background: var(--accent); color: #fff; border: none; cursor: pointer; font-weight: 600; }
  button:hover { opacity: .9; }
  .inline { display: flex; gap: 8px; }
  .inline button { width: auto; white-space: nowrap; }
  .cat { display: grid; grid-template-columns: 130px 1fr 170px; align-items: center; gap: 10px; margin: 8px 0; font-size: 14px; }
  .bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
  .bar div { height: 100%; background: var(--accent); }
  .cat .amt { text-align: right; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  td.num, th.num { text-align: right; }
  .del { background: none; color: var(--bad); padding: 2px 6px; width: auto; }
  .error { color: var(--bad); font-size: 13px; min-height: 16px; }
  .muted { color: var(--muted); font-size: 14px; }
  @media (max-width: 800px) { .stats { grid-template-columns: 1fr 1fr; } .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Smart Expense &amp; Budget Tracker</h1>
  <p>Record daily expenses, see where your money goes, and stay within your monthly budget.</p>
</header>

<main>
  <section class="stats">
    <div class="card stat"><div class="label">Spent this month</div><div class="value" id="monthTotal">-</div></div>
    <div class="card stat"><div class="label">Monthly budget</div><div class="value" id="budget">-</div></div>
    <div class="card stat"><div class="label">Remaining</div><div class="value" id="remaining">-</div></div>
    <div class="card stat"><div class="label">All-time total</div><div class="value" id="total">-</div></div>
  </section>

  <section class="row">
    <div class="card">
      <h2>Add Expense</h2>
      <form id="addForm">
        <label>Category <select id="category"></select></label>
        <label>Description <input id="description" placeholder="e.g. Bus ticket, Lunch"></label>
        <label>Amount (Rs.) <input id="amount" type="number" step="0.01" min="0.01" placeholder="e.g. 150"></label>
        <button type="submit">Add Expense</button>
        <div class="error" id="addError"></div>
      </form>
    </div>

    <div class="card">
      <h2>Budget Status</h2>
      <div class="progress"><div id="progressBar"></div></div>
      <div class="alert none" id="budgetAlert">Loading...</div>
      <form id="budgetForm" style="margin-top:16px">
        <label>Set / update monthly budget (Rs.)</label>
        <div class="inline">
          <input id="budgetInput" type="number" step="0.01" min="0.01" placeholder="e.g. 5000">
          <button type="submit">Save</button>
        </div>
        <div class="error" id="budgetError"></div>
      </form>
    </div>
  </section>

  <section class="card">
    <h2>Category Summary</h2>
    <div id="categories"></div>
  </section>

  <section class="card">
    <h2>All Expenses</h2>
    <input id="search" placeholder="Search by keyword, category or date (YYYY-MM-DD)" style="margin-bottom:12px">
    <table>
      <thead><tr><th>ID</th><th>Date</th><th>Category</th><th>Description</th><th class="num">Amount</th><th></th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </section>
</main>

<script>
  let state = null;
  const rs = n => "Rs. " + Number(n).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  async function api(path, body) {
    const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Something went wrong");
    return data;
  }

  function render(data) {
    state = data;
    document.getElementById("monthTotal").textContent = rs(data.month_total);
    document.getElementById("total").textContent = rs(data.total);
    document.getElementById("budget").textContent = data.budget > 0 ? rs(data.budget) : "Not set";

    // Budget status (same rules as check_budget_alert in analytics.py)
    const alertBox = document.getElementById("budgetAlert");
    const bar = document.getElementById("progressBar");
    if (data.budget <= 0) {
      document.getElementById("remaining").textContent = "-";
      alertBox.className = "alert none";
      alertBox.textContent = "Monthly budget not set yet. Set one below.";
      bar.style.width = "0";
    } else {
      const remaining = data.budget - data.month_total;
      const pct = data.month_total / data.budget * 100;
      document.getElementById("remaining").textContent = rs(remaining);
      bar.style.width = Math.min(pct, 100) + "%";
      if (remaining < 0) {
        alertBox.className = "alert bad"; bar.style.background = "var(--bad)";
        alertBox.textContent = `ALERT: Budget exceeded by ${rs(-remaining)}!`;
      } else if (pct >= 80) {
        alertBox.className = "alert warn"; bar.style.background = "var(--warn)";
        alertBox.textContent = `WARNING: You have used ${pct.toFixed(1)}% of your budget. Only ${rs(remaining)} left!`;
      } else {
        alertBox.className = "alert ok"; bar.style.background = "var(--ok)";
        alertBox.textContent = `On track: ${pct.toFixed(1)}% used, ${rs(remaining)} remaining.`;
      }
    }

    // Category dropdown (filled once)
    const select = document.getElementById("category");
    if (!select.options.length) {
      data.categories.forEach(c => select.add(new Option(c, c)));
    }

    // Category summary bars
    const cats = Object.entries(data.category_totals).sort((a, b) => b[1] - a[1]);
    document.getElementById("categories").innerHTML = cats.length
      ? cats.map(([cat, amt]) => {
          const pct = data.total ? amt / data.total * 100 : 0;
          return `<div class="cat"><span>${esc(cat)}</span>
                  <div class="bar"><div style="width:${pct}%"></div></div>
                  <span class="amt">${rs(amt)} (${pct.toFixed(1)}%)</span></div>`;
        }).join("")
      : '<p class="muted">No expenses yet.</p>';

    renderTable();
  }

  function renderTable() {
    const q = document.getElementById("search").value.trim().toLowerCase();
    const rows = state.expenses.filter(e =>
      !q || e.description.toLowerCase().includes(q) || e.category.toLowerCase().includes(q) || e.date.includes(q));
    document.getElementById("tableBody").innerHTML = rows.length
      ? rows.map(e => `<tr><td>${e.id}</td><td>${e.date}</td><td>${esc(e.category)}</td>
          <td>${esc(e.description)}</td><td class="num">${rs(e.amount)}</td>
          <td class="num"><button class="del" onclick="removeExpense(${e.id})">Delete</button></td></tr>`).join("")
      : '<tr><td colspan="6" class="muted">No matching expenses.</td></tr>';
  }

  async function removeExpense(id) {
    const e = state.expenses.find(x => x.id === id);
    if (!confirm(`Delete "${e.description}" (${rs(e.amount)})?`)) return;
    render(await api("/api/delete", { id }));
  }

  document.getElementById("addForm").addEventListener("submit", async ev => {
    ev.preventDefault();
    const err = document.getElementById("addError");
    err.textContent = "";
    try {
      render(await api("/api/add", {
        category: document.getElementById("category").value,
        description: document.getElementById("description").value,
        amount: document.getElementById("amount").value,
      }));
      document.getElementById("description").value = "";
      document.getElementById("amount").value = "";
    } catch (e) { err.textContent = e.message; }
  });

  document.getElementById("budgetForm").addEventListener("submit", async ev => {
    ev.preventDefault();
    const err = document.getElementById("budgetError");
    err.textContent = "";
    try {
      render(await api("/api/budget", { budget: document.getElementById("budgetInput").value }));
      document.getElementById("budgetInput").value = "";
    } catch (e) { err.textContent = e.message; }
  });

  document.getElementById("search").addEventListener("input", renderTable);
  api("/api/data").then(render);
</script>
</body>
</html>
